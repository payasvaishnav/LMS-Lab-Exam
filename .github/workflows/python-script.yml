name: Run Python script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python script
        run: python lms.py search "python"

      - name: Display workflow execution status
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Workflow execution status: $JOB_STATUS"
          echo "Workflow execution status: **$JOB_STATUS**" >> "$GITHUB_STEP_SUMMARY"
