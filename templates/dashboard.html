<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LMS Dashboard</title></head>
<body>
  <h1 id="welcome">Welcome, {{ username }}</h1>
  <form method="get">
    <label for="query">Search books</label>
    <input id="query" name="q" value="{{ query }}">
    <button type="submit">Search</button>
  </form>
  <ul>{% for book in books %}<li>{{ book.title }} by {{ book.author }}</li>{% else %}<li>No books found</li>{% endfor %}</ul>
</body>
</html>
