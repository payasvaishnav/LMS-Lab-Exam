<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LMS Login</title></head>
<body>
  <h1>Library Management System</h1>
  <h2>Login</h2>
  <form method="post">
    <p><label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required></p>
    <p><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></p>
    <button id="login-button" type="submit">Log in</button>
  </form>
  {% if error %}<p id="login-error" role="alert">{{ error }}</p>{% endif %}
</body>
</html>
